<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡牌对决Demo</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  min-height: 100vh;
  color: #fff;
}

.game-container {
  max-width: 800px;
  margin: 0 auto;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #ffd700;
  margin-bottom: 20px;
  text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}

.game-info {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-bottom: 30px;
  padding: 15px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
}

.info-item {
  font-size: 18px;
}

.info-item span {
  color: #ffd700;
  font-weight: bold;
  font-size: 24px;
}

.players {
  display: flex;
  justify-content: space-around;
  margin-bottom: 30px;
}

.player {
  text-align: center;
  padding: 20px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 15px;
  min-width: 280px;
  border: 2px solid transparent;
  transition: all 0.3s ease;
}

.player.active {
  border-color: #ffd700;
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
}

.player h2 {
  margin-bottom: 15px;
  color: #4fc3f7;
}

.health-bar {
  width: 180px;
  height: 24px;
  background: linear-gradient(180deg, #333 0%, #222 100%);
  border-radius: 12px;
  margin: 0 auto 10px;
  position: relative;
  overflow: hidden;
  border: 2px solid #555;
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
}

.health-fill {
  height: 100%;
  background: linear-gradient(180deg, #8bc34a 0%, #4caf50 50%, #388e3c 100%);
  transition: width 0.5s ease;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
}

.health-fill.danger {
  background: linear-gradient(180deg, #ff5722 0%, #f44336 50%, #c62828 100%);
  box-shadow: 0 0 10px rgba(244, 67, 54, 0.5);
  animation: pulse-danger 1s infinite;
}

.health-fill.warning {
  background: linear-gradient(180deg, #ffc107 0%, #ff9800 50%, #f57c00 100%);
  box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
}

@keyframes pulse-danger {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

.health-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-weight: bold;
  font-size: 14px;
  text-shadow: 1px 1px 2px #000;
  color: #fff;
}

.status {
  min-height: 24px;
  color: #ff6b6b;
  font-size: 14px;
  font-weight: bold;
  text-shadow: 0 0 5px rgba(255, 107, 107, 0.5);
}

.log {
  background: rgba(0, 0, 0, 0.3);
  border-radius: 10px;
  padding: 15px;
  max-height: 200px;
  overflow-y: auto;
}

.log h3 {
  margin-bottom: 10px;
  color: #aaa;
  font-size: 16px;
}

#log-content {
  font-family: monospace;
  font-size: 14px;
  line-height: 1.6;
}

.log-entry {
  padding: 5px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.log-entry:last-child {
  border-bottom: none;
}

.log-entry .time {
  color: #888;
  margin-right: 10px;
}

.log-entry .effect { color: #ffd700; }
.log-entry .damage { color: #f44336; }
.log-entry .heal { color: #4caf50; }

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  justify-content: center;
  align-items: center;
  z-index: 100;
}

.modal.active { display: flex; }

.modal-content {
  background: linear-gradient(135deg, #2a2a4e 0%, #1a1a2e 100%);
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  border: 2px solid #667eea;
}

.modal-content h3 {
  margin-bottom: 20px;
  color: #ffd700;
}

.target-buttons, .rps-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
}

.target-buttons button, .rps-buttons button {
  padding: 15px 30px;
  font-size: 18px;
  background: #667eea;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  transition: transform 0.2s;
}

.target-buttons button:hover, .rps-buttons button:hover {
  transform: scale(1.1);
}

.dice-container {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin: 20px 0;
}

.dice-box { text-align: center; }

.dice-label {
  font-size: 16px;
  color: #aaa;
  margin-bottom: 10px;
}

.dice {
  width: 80px;
  height: 80px;
  background: linear-gradient(145deg, #fff 0%, #e0e0e0 100%);
  border-radius: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 40px;
  font-weight: bold;
  color: #333;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3), inset 0 -2px 5px rgba(0, 0, 0, 0.1);
}

#dice-result {
  font-size: 18px;
  color: #ffd700;
  margin: 15px 0;
  min-height: 24px;
}

.roll-dice-btn {
  padding: 15px 40px;
  font-size: 20px;
  background: linear-gradient(135deg, #ffd700 0%, #ff9800 100%);
  border: none;
  border-radius: 10px;
  color: #333;
  cursor: pointer;
  font-weight: bold;
  transition: transform 0.2s;
}

.roll-dice-btn:hover { transform: scale(1.05); }

#game-over-modal .modal-content h2 {
  color: #ffd700;
  font-size: 32px;
  margin-bottom: 20px;
}

#game-over-modal .modal-content p {
  font-size: 24px;
  color: #fff;
  margin-bottom: 30px;
}

.restart-btn {
  padding: 15px 40px;
  font-size: 20px;
  background: linear-gradient(135deg, #4caf50 0%, #8bc34a 100%);
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
  font-weight: bold;
  transition: transform 0.2s;
}

.restart-btn:hover { transform: scale(1.05); }

.hand {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  min-height: 160px;
  padding: 10px 20px;
}

.hand-label {
  text-align: center;
  font-size: 12px;
  color: #888;
  margin-top: 10px;
}

.hand-card {
  position: relative;
  width: 70px;
  height: 100px;
  background: linear-gradient(145deg, #fff 0%, #f5f5f5 100%);
  border-radius: 8px;
  border: 2px solid #d4af37;
  color: #333;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 8px 5px;
  box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
  transition: all 0.3s ease;
  margin: 0 -15px;
}

.hand-card::before {
  content: '♠';
  font-size: 16px;
  align-self: flex-start;
}

.hand-card::after {
  content: '♠';
  font-size: 16px;
  align-self: flex-end;
  transform: rotate(180deg);
}

.hand-card[data-card="quantum"]::before,
.hand-card[data-card="quantum"]::after { content: '⚛'; color: #9c27b0; }
.hand-card[data-card="hall"]::before,
.hand-card[data-card="hall"]::after { content: '⚡'; color: #ff9800; }
.hand-card[data-card="combine"]::before,
.hand-card[data-card="combine"]::after { content: '🔀'; color: #2196f3; }
.hand-card[data-card="duel"]::before,
.hand-card[data-card="duel"]::after { content: '⚔'; color: #f44336; }
.hand-card[data-card="rage"]::before,
.hand-card[data-card="rage"]::after { content: '🔥'; color: #e91e63; }

.hand-card:first-child {
  transform: rotate(-15deg) translateY(-10px);
  z-index: 1;
}

.hand-card:last-child {
  transform: rotate(15deg) translateY(-10px);
  z-index: 1;
}

.hand-card:nth-child(2) { z-index: 2; }

.hand-card:hover:not(:disabled) {
  transform: translateY(-30px) scale(1.15);
  z-index: 100;
  box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
}

.hand-card:disabled {
  background: linear-gradient(145deg, #999 0%, #777 100%);
  border-color: #666;
  color: #ccc;
  cursor: not-allowed;
}

.hand-card:disabled::before,
.hand-card:disabled::after { display: none; }

.hand-card .card-name {
  font-size: 11px;
  text-align: center;
  line-height: 1.2;
}
  </style>
</head>
<body>
  <div class="game-container">
    <h1>卡牌对决 Demo</h1>

    <div class="game-info">
      <div class="info-item">游戏倍率: <span id="multiplier">1</span></div>
      <div class="info-item">当前回合: <span id="turn">1</span></div>
      <div class="info-item" id="phase-info">掷骰阶段</div>
    </div>

    <div class="players">
      <div class="player" id="player1">
        <h2>玩家1</h2>
        <div class="health-bar">
          <div class="health-fill" id="p1-health-fill"></div>
          <span class="health-text" id="p1-health">10</span>
        </div>
        <div class="status" id="p1-status"></div>
        <div class="hand-label">手牌</div>
        <div class="hand" id="p1-hand"></div>
      </div>

      <div class="player" id="player2">
        <h2>玩家2</h2>
        <div class="health-bar">
          <div class="health-fill" id="p2-health-fill"></div>
          <span class="health-text" id="p2-health">10</span>
        </div>
        <div class="status" id="p2-status"></div>
        <div class="hand-label">手牌</div>
        <div class="hand" id="p2-hand"></div>
      </div>
    </div>

    <div class="log" id="game-log">
      <h3>游戏日志</h3>
      <div id="log-content"></div>
    </div>
  </div>

  <div class="modal" id="dice-modal">
    <div class="modal-content">
      <h3>🎲 掷骰子决定回合</h3>
      <p>点击按钮掷骰，点数大者获得回合</p>
      <div class="dice-container">
        <div class="dice-box">
          <div class="dice-label">玩家1</div>
          <div class="dice">?</div>
        </div>
        <div class="dice-box">
          <div class="dice-label">玩家2</div>
          <div class="dice">?</div>
        </div>
      </div>
      <div id="dice-result"></div>
      <button id="roll-dice-btn" class="roll-dice-btn">🎲 掷骰子</button>
    </div>
  </div>

  <div class="modal" id="target-modal">
    <div class="modal-content">
      <h3>选择目标</h3>
      <div class="target-buttons">
        <button id="target-p1">玩家1</button>
        <button id="target-p2">玩家2</button>
        <button id="target-self">自己</button>
      </div>
    </div>
  </div>

  <div class="modal" id="rps-modal">
    <div class="modal-content">
      <h3>石头✊ 剪刀✌️ 布✋</h3>
      <p>选择你的出招</p>
      <div class="rps-buttons">
        <button data-choice="rock">✊ 石头</button>
        <button data-choice="scissors">✌️ 剪刀</button>
        <button data-choice="paper">✋ 布</button>
      </div>
    </div>
  </div>

  <div class="modal" id="game-over-modal">
    <div class="modal-content">
      <h2>🎉 游戏结束 🎉</h2>
      <p id="winner-text"></p>
      <button id="restart-btn" class="restart-btn">再来一局</button>
    </div>
  </div>

  <script>
const CARD_DECK = ['quantum', 'hall', 'combine', 'duel', 'rage'];

// 音效系统
const Sound = {
  ctx: null,
  
  init() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { console.log('Audio not supported'); }
  },
  
  play(type) {
    if (!this.ctx) this.init();
    if (!this.ctx) return;
    
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    switch(type) {
      case 'dice': // 骰子滚动
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
        break;
        
      case 'draw': // 抽牌
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
        break;
        
      case 'card': // 使用卡牌
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523, this.ctx.currentTime);
        osc.frequency.setValueAtTime(659, this.ctx.currentTime + 0.1);
        osc.frequency.setValueAtTime(784, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
        break;
        
      case 'damage': // 受伤
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
        break;
        
      case 'heal': // 治疗
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.setValueAtTime(600, this.ctx.currentTime + 0.1);
        osc.frequency.setValueAtTime(800, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
        break;
        
      case 'win': // 获胜
        osc.type = 'square';
        osc.frequency.setValueAtTime(523, this.ctx.currentTime);
        osc.frequency.setValueAtTime(659, this.ctx.currentTime + 0.15);
        osc.frequency.setValueAtTime(784, this.ctx.currentTime + 0.3);
        osc.frequency.setValueAtTime(1047, this.ctx.currentTime + 0.45);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.6);
        break;
        
case 'click': // 点击
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
        break;
        
      case 'duel': // 决斗 - 紧张战斗音效
        this.playDuelMusic();
        break;
        
      case 'duelWin': // 决斗胜利
        this.playDuelWin();
        break;
        
      case 'duelLose': // 决斗失败
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.5);
        break;
        
      case 'rps': // 石头剪刀布选择
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.setValueAtTime(400, this.ctx.currentTime + 0.08);
        osc.frequency.setValueAtTime(500, this.ctx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
        break;
    }
  },
  
  // 决斗音乐 - 紧张激烈
  playDuelMusic() {
    if (!this.ctx) return;
    const duration = 0.15;
    const notes = [262, 330, 392, 523, 392, 330, 262, 330];
    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * duration);
      gain.gain.setValueAtTime(0.08, this.ctx.currentTime + i * duration);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + i * duration + duration * 0.9);
      osc.start(this.ctx.currentTime + i * duration);
      osc.stop(this.ctx.currentTime + i * duration + duration);
    });
  },
  
  // 决斗胜利音乐 - 更激烈
  playDuelWin() {
    if (!this.ctx) return;
    const duration = 0.12;
    const notes = [523, 659, 784, 1047, 784, 659, 523, 659, 784, 1047];
    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * duration);
      gain.gain.setValueAtTime(0.1, this.ctx.currentTime + i * duration);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + i * duration + duration * 0.95);
      osc.start(this.ctx.currentTime + i * duration);
      osc.stop(this.ctx.currentTime + i * duration + duration);
    });
  }
};

const Game = {
  state: {
    players: [
      { id: 1, name: '玩家1', health: 10, maxHealth: 10, dyingTurns: 0, dying: false, hand: [], dead: false },
      { id: 2, name: '玩家2', health: 10, maxHealth: 10, dyingTurns: 0, dying: false, hand: [], dead: false }
    ],
    deck: [],
    multiplier: 1,
    turn: 1,
    currentPlayer: 0,
    turnWinner: null,
    phase: 'roll',
    canActThisTurn: false,
    diceValues: [0, 0],
    isDueling: false,
    duelState: null
  },

  initDeck() {
    this.state.deck = [];
    for (let i = 0; i < 50; i++) {
      this.state.deck.push(CARD_DECK[Math.floor(Math.random() * CARD_DECK.length)]);
    }
  },

  init() {
    this.initDeck();
    this.state = {
      players: [
        { id: 1, name: '玩家1', health: 10, maxHealth: 10, dyingTurns: 0, dying: false, hand: [], dead: false },
        { id: 2, name: '玩家2', health: 10, maxHealth: 10, dyingTurns: 0, dying: false, hand: [], dead: false }
      ],
      deck: this.state.deck,
      multiplier: 1,
      turn: 1,
      currentPlayer: 0,
      turnWinner: null,
      phase: 'roll',
      canActThisTurn: false,
      diceValues: [0, 0],
      isDueling: false,
      duelState: null
    };
    UI.updateAll();
    Logger.log('游戏开始！');
    Sound.play('win');
    this.startTurnRoll();
  },

  drawCard(playerId, count = 1) {
    const player = this.getPlayer(playerId);
    const drawn = [];
    for (let i = 0; i < count; i++) {
      if (this.state.deck.length === 0) this.initDeck();
      if (this.state.deck.length > 0) {
        player.hand.push(this.state.deck.pop());
      }
    }
    return drawn;
  },

  discardCard(playerId, cardIndex) {
    const player = this.getPlayer(playerId);
    if (cardIndex >= 0 && cardIndex < player.hand.length) {
      const discarded = player.hand.splice(cardIndex, 1)[0];
      Logger.log(`${player.name} 弃置 ${this.getCardName(discarded)}`, 'effect');
      return discarded;
    }
    return null;
  },

  maintainHandLimit(playerId) {
    const player = this.getPlayer(playerId);
    while (player.hand.length > 3) {
      this.discardCard(playerId, player.hand.length - 1);
    }
  },

  getCardName(card) {
    const names = { quantum: '量子力学', hall: '霍尔元件', combine: '自由组合', duel: '决斗', rage: '发怒' };
    return names[card] || card;
  },

  getCurrentPlayer() { return this.state.players[this.state.currentPlayer]; },
  getOpponent() { return this.state.players[this.state.currentPlayer === 0 ? 1 : 0]; },
  getPlayer(id) { return this.state.players[id - 1]; },

  setHealth(playerId, newHealth, source) {
    const player = this.getPlayer(playerId);
    if (newHealth >= 11) {
      Logger.log(`${player.name} 炸血！血量归0`, 'damage');
      newHealth = 0;
    }
    newHealth = Math.max(0, Math.min(10, newHealth));
    const oldHealth = player.health;
    player.health = newHealth;
    if (newHealth > oldHealth) {
      Logger.log(`${player.name} 回复 ${newHealth - oldHealth} 血量`, 'heal');
      Sound.play('heal');
    }
    else if (newHealth < oldHealth) {
      Logger.log(`${player.name} 受到 ${oldHealth - newHealth} 伤害`, 'damage');
      Sound.play('damage');
    }

    if (player.health === 0 && oldHealth > 0) {
      if (!player.dying || player.dyingTurns === 0) {
        player.dying = true;
        player.dyingTurns = 1;
        Logger.log(`${player.name} 进入濒死状态！(第1回合)`, 'damage');
      }
    }
    if (player.health > 0 && oldHealth === 0) {
      player.dying = false;
      player.dyingTurns = 0;
      Logger.log(`${player.name} 脱离濒死状态`);
      Sound.play('heal');
    }
    this.checkDeath();
    UI.updateHealth(playerId);
  },

  checkDyingAtTurnEnd() {
    this.state.players.forEach(player => {
      if (player.health === 0 && !player.dead && player.dying) {
        player.dyingTurns++;
        if (player.dyingTurns >= 3) {
          Logger.log(`${player.name} 死亡！连续3回合濒死`, 'damage');
          player.dead = true;
        } else {
          Logger.log(`第${player.dyingTurns}回合濒死...`, 'damage');
        }
        UI.updateStatus(player.id);
      }
    });
  },

  handleDying(playerId) { UI.updateStatus(playerId); },

  checkDeath() {
    const deadPlayers = this.state.players.filter(p => p.dead);
    if (deadPlayers.length > 0) {
      const winner = deadPlayers[0].id === 1 ? this.state.players[1] : this.state.players[0];
      Logger.log(`游戏结束！${winner.name} 获胜！`, 'effect');
      this.disableAllCards();
    }
  },

  setMultiplier(value) {
    this.state.multiplier = value;
    Logger.log(`游戏倍率变为 ${value}`, 'effect');
    UI.updateMultiplier();
  },

  startTurnRoll() {
    this.state.phase = 'roll';
    this.state.canActThisTurn = false;
    UI.updateTurn();
    Sound.play('turn');
    Logger.log(`回合 ${this.state.turn} - 请甩骰子！`, 'effect');
    UI.showDiceModal();
  },

  rollDice(values) {
    this.state.diceValues = values;
    const p1 = this.state.players[0];
    const p2 = this.state.players[1];
    Logger.log(`${p1.name} 掷出 ${values[0]} 点`, 'effect');
    Logger.log(`${p2.name} 掷出 ${values[1]} 点`, 'effect');

    if (values[0] > values[1]) {
      this.state.currentPlayer = 0;
      this.state.turnWinner = 1;
      Logger.log(`${p1.name} 点数更大，获得回合！`, 'effect');
      Sound.play('win');
    } else if (values[1] > values[0]) {
      this.state.currentPlayer = 1;
      this.state.turnWinner = 2;
      Logger.log(`${p2.name} 点数更大，获得回合！`, 'effect');
      Sound.play('win');
    } else {
      Logger.log('点数相同，重新掷骰！', 'effect');
      setTimeout(() => { this.startTurnRoll(); }, 800);
      return;
    }
    this.startDrawPhase();
  },

  startDrawPhase() {
    this.state.phase = 'draw';
    const player = this.getCurrentPlayer();
    Logger.log(`${player.name} 开始抽牌...`, 'effect');
    Sound.play('draw');
    this.drawCard(player.id, 3);
    this.maintainHandLimit(player.id);
    const handNames = player.hand.map(c => this.getCardName(c)).join(', ');
    Logger.log(`${player.name} 手牌: [${handNames}]`, 'effect');
    this.state.phase = 'action';
    this.state.canActThisTurn = true;
    UI.updateHands();
    UI.updateTurnInfo();
    Logger.log(`${player.name} 的回合 - 请使用一张手牌！`, 'effect');
  },

  useHandCard(cardIndex) {
    if (!this.state.canActThisTurn) return { success: false };
    const player = this.getCurrentPlayer();
    if (cardIndex < 0 || cardIndex >= player.hand.length) return { success: false };
    const cardName = player.hand[cardIndex];
    Logger.log(`${player.name} 使用 ${this.getCardName(cardName)}`, 'effect');
    player.hand.splice(cardIndex, 1);
    UI.updateHands();
    return CardHandler.useCard(cardName, null, player.id);
  },

  endTurn() {
    this.checkDyingAtTurnEnd();
    if (this.checkGameOver()) return;
    this.state.canActThisTurn = false;
    this.state.turn++;
    Logger.log(`回合结束！`, 'effect');
    UI.updateTurn();
    UI.updateTurnInfo();
    setTimeout(() => { this.startTurnRoll(); }, 500);
  },

  checkGameOver() {
    const deadPlayers = this.state.players.filter(p => p.dead);
    if (deadPlayers.length > 0) {
      const winner = deadPlayers[0].id === 1 ? this.state.players[1] : this.state.players[0];
      Logger.log(`游戏结束！${winner.name} 获胜！`, 'effect');
      this.disableAllCards();
      UI.showGameOverModal(winner.name);
      return true;
    }
    return false;
  },

  disableAllCards() {
    this.state.canActThisTurn = false;
  }
};

const Logger = {
  log(message, type = 'normal') {
    console.log(`[${type}] ${message}`);
    const logContent = document.getElementById('log-content');
    if (!logContent) return;
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    const time = new Date().toLocaleTimeString();
    let msgClass = '';
    if (type === 'damage') msgClass = 'damage';
    else if (type === 'heal') msgClass = 'heal';
    else if (type === 'effect') msgClass = 'effect';
    entry.innerHTML = `<span class="time">[${time}]</span><span class="${msgClass}">${message}</span>`;
    logContent.appendChild(entry);
    logContent.scrollTop = logContent.scrollHeight;
  }
};

const Effects = {
  randomHealth() { return Math.floor(Math.random() * 11); },

  quantum(targetId, userId) {
    if (targetId === null) targetId = userId === 1 ? 2 : 1;
    const target = Game.getPlayer(targetId);
    const newHealth = this.randomHealth();
    Logger.log(`量子力学发动！${target.name} 血量变为 ${newHealth}`, 'effect');
    Game.setHealth(target.id, newHealth, 'quantum');
    return { success: true };
  },

  hall(targetId, userId) {
    if (targetId === null) targetId = userId === 1 ? 2 : 1;
    const self = Game.getPlayer(userId);
    const target = Game.getPlayer(targetId);
    const selfHealth = self.health;
    const targetHealth = target.health;
    const total = selfHealth + targetHealth;
    const isSelfGets5 = Math.random() < 0.5;
    let selfNew, targetNew;
    if (isSelfGets5) { selfNew = 5; targetNew = total - 5; }
    else { selfNew = total - 5; targetNew = 5; }
    Logger.log(`霍尔元件发动！和值: ${total}`, 'effect');
    Logger.log(`${self.name} 获得 ${selfNew} 血量`, isSelfGets5 ? 'heal' : 'damage');
    Logger.log(`${target.name} 获得 ${targetNew} 血量`, isSelfGets5 ? 'damage' : 'heal');
    Game.setHealth(self.id, selfNew, 'hall');
    Game.setHealth(target.id, targetNew, 'hall');
    return { success: true };
  },

  combine() {
    const originalHealths = Game.state.players.map(p => p.health);
    const shuffled = originalHealths.sort(() => Math.random() - 0.5);
    Logger.log(`自由组合发动！原始血量: [${originalHealths.join(', ')}]`, 'effect');
    Game.state.players.forEach((player, index) => {
      Game.setHealth(player.id, shuffled[index], 'combine');
    });
    const newHealths = Game.state.players.map(p => p.health);
    Logger.log(`新血量分配: [${newHealths.join(', ')}]`, 'effect');
    return { success: true };
  },

  duel(targetId, userId) {
    if (targetId === null) targetId = userId === 1 ? 2 : 1;
    const initiator = Game.getPlayer(userId);
    const opponent = Game.getPlayer(targetId);
    if (initiator.dead || opponent.dead) {
      Logger.log('无法与已死亡玩家决斗', 'damage');
      return { success: false };
    }
    Game.state.isDueling = true;
    Game.state.duelState = {
      initiator: initiator.id,
      opponent: opponent.id,
      multiplier: Game.state.multiplier,
      firstRound: true,
      initiatorWins: 0,
      opponentWins: 0
    };
    Logger.log(`${initiator.name} 向 ${opponent.name} 发起决斗！`, 'effect');
    Sound.play('duel');
    Logger.log(`赌注: ${Game.state.multiplier} 血量`, 'effect');
    UI.showRPSModal();
  },

  processRPS(choice) {
    const duel = Game.state.duelState;
    const choices = ['rock', 'scissors', 'paper'];
    const computerChoice = choices[Math.floor(Math.random() * 3)];
    const result = this.getRPSResult(choice, computerChoice);
    Logger.log(`你出: ${this.getChoiceName(choice)} | 对手出: ${this.getChoiceName(computerChoice)}`, 'effect');
    if (result === 'win') { duel.initiatorWins++; Logger.log('你赢了这一局！', 'heal'); }
    else if (result === 'lose') { duel.opponentWins++; Logger.log('你输了这一局', 'damage'); Sound.play('duelLose'); }
    else { Logger.log('平局！重新选择', 'effect'); UI.showRPSModal(); return; }
    if (duel.firstRound) {
      if (result === 'win') { this.endDuel(duel.initiator, duel.opponent, true); return; }
      else if (result === 'lose') { duel.firstRound = false; Logger.log('进入连续胜利模式！先赢2局者获胜', 'effect'); UI.showRPSModal(); return; }
    } else {
      if (duel.initiatorWins >= 2) { this.endDuel(duel.initiator, duel.opponent, true); return; }
      else if (duel.opponentWins >= 2) { this.endDuel(duel.opponent, duel.initiator, false); return; }
      UI.showRPSModal();
    }
  },

  getRPSResult(player, computer) {
    if (player === computer) return 'draw';
    if ((player === 'rock' && computer === 'scissors') ||
        (player === 'scissors' && computer === 'paper') ||
        (player === 'paper' && computer === 'rock')) return 'win';
    return 'lose';
  },

  getChoiceName(choice) {
    const names = { rock: '石头', scissors: '剪刀', paper: '布' };
    return names[choice];
  },

  endDuel(winnerId, loserId) {
    const duel = Game.state.duelState;
    const loser = Game.getPlayer(loserId);
    const damage = duel.multiplier;
    Logger.log(`${Game.getPlayer(winnerId).name} 赢得决斗！`, 'effect');
    Sound.play('duelWin');
    Logger.log(`${loser.name} 扣除 ${damage} 血量`, 'damage');
    Game.setHealth(loserId, loser.health - damage, 'duel');
    Game.setMultiplier(1);
    Game.state.isDueling = false;
    Game.state.duelState = null;
    UI.hideRPSModal();
    setTimeout(() => { Game.endTurn(); }, 500);
  },

  rage() {
    const newMultiplier = Game.state.multiplier * 2;
    Game.setMultiplier(newMultiplier);
    Logger.log(`发怒！倍率提升至 ${newMultiplier}！`, 'effect');
    return { success: true };
  }
};

const CardHandler = {
  useCard(cardName, targetId, userId) {
    if (!targetId) targetId = userId === 1 ? 2 : 1;
    const needsTarget = ['quantum', 'hall', 'duel'];
    const noTarget = ['combine', 'rage'];
    if (noTarget.includes(cardName)) {
      switch (cardName) {
        case 'combine': Effects.combine(); break;
        case 'rage': Effects.rage(); break;
      }
      this.afterCardUse();
    } else if (needsTarget.includes(cardName)) {
      UI.pendingCard = cardName;
      const self = userId;
      document.getElementById('target-p1').textContent = '玩家1' + (self === 1 ? '(自己)' : '');
      document.getElementById('target-p2').textContent = '玩家2' + (self === 2 ? '(自己)' : '');
      document.getElementById('target-self').style.display = 'inline-block';
      UI.showTargetModal();
    }
  },

  useCardWithTarget(cardName, targetId, userId) {
    switch (cardName) {
      case 'quantum': Effects.quantum(targetId, userId); break;
      case 'hall': Effects.hall(targetId, userId); break;
      case 'duel': Effects.duel(targetId, userId); break;
    }
    this.afterCardUse();
  },

  afterCardUse() {
    Game.state.canActThisTurn = false;
    UI.updateTurnInfo();
    Sound.play('card');
    Logger.log('回合结束！', 'effect');
    setTimeout(() => { Game.endTurn(); }, 500);
  }
};

const UI = {
  init() {
    document.getElementById('roll-dice-btn').addEventListener('click', () => { 
      Sound.play('dice');
      this.handleRollDice(); 
    });
    document.getElementById('target-p1').addEventListener('click', () => { Sound.play('click'); this.selectTarget(1); });
    document.getElementById('target-p2').addEventListener('click', () => { Sound.play('click'); this.selectTarget(2); });
    document.getElementById('target-self').addEventListener('click', () => { Sound.play('click'); this.selectTarget(Game.state.currentPlayer + 1); });
    document.querySelectorAll('.rps-buttons button').forEach(btn => {
      btn.addEventListener('click', () => { Sound.play('rps'); this.handleRPS(btn.dataset.choice); });
    });
    document.getElementById('restart-btn').addEventListener('click', () => {
      Sound.play('click');
      this.hideGameOverModal();
      Game.init();
    });
    Game.init();
  },

  showDiceModal() {
    document.getElementById('dice-modal').classList.add('active');
    document.getElementById('dice-result').textContent = '';
    document.querySelectorAll('.dice').forEach(d => d.textContent = '?');
  },

  hideDiceModal() { document.getElementById('dice-modal').classList.remove('active'); },

  handleRollDice() {
    const dice1 = Math.floor(Math.random() * 6) + 1;
    const dice2 = Math.floor(Math.random() * 6) + 1;
    this.animateDice(dice1, dice2);
  },

  animateDice(final1, final2) {
    const diceEls = document.querySelectorAll('.dice');
    let rollCount = 0;
    const rollInterval = setInterval(() => {
      diceEls[0].textContent = Math.floor(Math.random() * 6) + 1;
      diceEls[1].textContent = Math.floor(Math.random() * 6) + 1;
      rollCount++;
      if (rollCount >= 15) {
        clearInterval(rollInterval);
        diceEls[0].textContent = final1;
        diceEls[1].textContent = final2;
        document.getElementById('dice-result').textContent = `玩家1: ${final1} 点 | 玩家2: ${final2} 点`;
        setTimeout(() => {
          Game.rollDice([final1, final2]);
          this.hideDiceModal();
        }, 1000);
      }
    }, 80);
  },

  showTargetModal() { document.getElementById('target-modal').classList.add('active'); },
  hideTargetModal() { document.getElementById('target-modal').classList.remove('active'); this.pendingCard = null; },

  selectTarget(targetId) {
    CardHandler.useCardWithTarget(this.pendingCard, targetId, Game.state.turnWinner);
    this.hideTargetModal();
  },

  showRPSModal() { document.getElementById('rps-modal').classList.add('active'); },
  hideRPSModal() { document.getElementById('rps-modal').classList.remove('active'); },
  handleRPS(choice) { this.hideRPSModal(); Effects.processRPS(choice); },

  showGameOverModal(winnerName) {
    document.getElementById('winner-text').textContent = `${winnerName} 获胜！`;
    document.getElementById('game-over-modal').classList.add('active');
    setTimeout(() => Sound.play('win'), 300);
  },

  hideGameOverModal() { document.getElementById('game-over-modal').classList.remove('active'); },

  updateAll() {
    this.updateHealth(1);
    this.updateHealth(2);
    this.updateStatus(1);
    this.updateStatus(2);
    this.updateMultiplier();
    this.updateTurn();
    this.updateTurnInfo();
    this.updateHands();
  },

  updateHealth(playerId) {
    const player = Game.getPlayer(playerId);
    const healthFill = document.getElementById(`p${playerId}-health-fill`);
    const healthText = document.getElementById(`p${playerId}-health`);
    const percent = (player.health / player.maxHealth) * 100;
    healthFill.style.width = `${percent}%`;
    healthText.textContent = player.health;
    healthFill.classList.remove('danger', 'warning');
    if (player.health <= 2) healthFill.classList.add('danger');
    else if (player.health <= 4) healthFill.classList.add('warning');
  },

  updateStatus(playerId) {
    const player = Game.getPlayer(playerId);
    const statusEl = document.getElementById(`p${playerId}-status`);
    if (player.dead) { statusEl.textContent = '已死亡'; statusEl.style.color = '#ff0000'; }
    else if (player.dying) { statusEl.textContent = `濒死 (${player.dyingTurns}/3回合)`; statusEl.style.color = '#ff6b6b'; }
    else { statusEl.textContent = ''; }
  },

  updateMultiplier() { document.getElementById('multiplier').textContent = Game.state.multiplier; },
  updateTurn() { document.getElementById('turn').textContent = Game.state.turn; },

  updateTurnInfo() {
    this.updateTurn();
    this.updateActivePlayer();
    const phaseInfo = document.getElementById('phase-info');
    const turnWinner = Game.state.turnWinner;
    const canAct = Game.state.canActThisTurn;
    const currentPlayer = Game.getCurrentPlayer();
    let phaseText = '';
    let winnerText = turnWinner ? `当前回合: ${currentPlayer.name}` : '';
    let actionText = canAct ? '可使用手牌' : '等待掷骰';
    if (Game.state.phase === 'roll') phaseText = '掷骰阶段';
    else if (Game.state.phase === 'draw') phaseText = '抽牌阶段';
    else if (Game.state.phase === 'action') phaseText = '行动阶段';
    phaseInfo.innerHTML = `${phaseText}<br>${winnerText}<br>${actionText}`;
  },

  updateActivePlayer() {
    [1, 2].forEach(pid => {
      const playerEl = document.getElementById(`player${pid}`);
      playerEl.classList.remove('active');
      if (Game.state.turnWinner === pid && Game.state.canActThisTurn) {
        playerEl.classList.add('active');
      }
    });
  },

  updateHands() {
    [1, 2].forEach(pid => {
      const player = Game.getPlayer(pid);
      const handContainer = document.getElementById(`p${pid}-hand`);
      handContainer.innerHTML = '';
      player.hand.forEach((card, index) => {
        const cardBtn = document.createElement('button');
        cardBtn.className = 'hand-card';
        cardBtn.dataset.card = card;
        cardBtn.innerHTML = `<span class="card-name">${Game.getCardName(card)}</span>`;
        cardBtn.dataset.player = pid;
        if (Game.state.canActThisTurn && Game.state.turnWinner === pid) {
          cardBtn.addEventListener('click', () => {
            if (pid === Game.state.turnWinner) {
              Sound.play('click');
              Game.useHandCard(index);
            }
          });
        } else {
          cardBtn.disabled = true;
        }
        handContainer.appendChild(cardBtn);
      });
    });
  }
};

document.addEventListener('DOMContentLoaded', () => { UI.init(); });
  </script>
